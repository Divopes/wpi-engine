<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>WPI Modern</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #14141e);
            color: white;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }
        .app-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #00ffcc;
        }
        .app-item.disabled {
            opacity: 0.5;
            border-left-color: #ff4444;
            pointer-events: none;
        }
        .controls {
            margin-top: 20px;
            text-align: right;
        }
        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #00ccaa;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }
        #status-log {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>
<h2>WPI Installer 2.0 <span id="sys-info" style="font-size: 14px; color: #00ffcc;"></span></h2>

<div class="glass-panel" id="app-list">
</div>

<div class="controls">
    <button onclick="startInstall()">НАЧАТЬ УСТАНОВКУ</button>
    <div id="status-log">Готов к работе.</div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
